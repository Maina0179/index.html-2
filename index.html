<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface2:#F2F4F7;
    --grid: rgba(37,99,235,0.035);
    --sand:#1A1D23;
    --sand-dim:#6B7280;
    --gold:#2563EB;
    --gold-dim:#DBEAFE;
    --sting:#DC2626;
    --sting-dim:#FBDCDA;
    --sage:#16A34A;
    --sage-dim:#DCF3E3;
    --on-accent:#FFFFFF;
    --shadow-color: rgba(20,30,60,0.08);
    --sidebar-bg:#2563EB;
    --sidebar-text:#FFFFFF;
    --radius: 14px;
  }
  body.theme-dark{
    --bg:#1B1712;
    --surface:#241F18;
    --surface2:#2E2718;
    --grid: rgba(232,217,181,0.055);
    --sand:#EDE1C4;
    --sand-dim:#AFA07C;
    --gold:#D4A24C;
    --gold-dim:#8C6E36;
    --sting:#C1432B;
    --sting-dim:#5A2419;
    --sage:#7A9B5B;
    --sage-dim:#33421F;
    --on-accent:#1B1712;
    --shadow-color: rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    color:var(--sand);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; margin:0; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  #app{ max-width:680px; margin:0 auto; padding:24px 18px 60px; }
  body.has-sidebar #app{ margin:0; margin-left:56px; }
  .katex{ font-size:1.05em; }

  .brand{ display:flex; align-items:center; gap:14px; margin-bottom:6px; cursor:pointer; }
  .brand svg{ width:46px; height:30px; flex-shrink:0; }
  .brand-name{ font-size:1.5rem; }
  .brand-tail{ height:3px; width:120px; margin:6px 0 30px 60px; background:linear-gradient(90deg, var(--gold), transparent); border-radius:2px; }
  .tagline{ font-family:'Fraunces', serif; font-weight:700; font-style:italic; color:var(--gold); font-size:1.05rem; margin:-18px 0 22px; letter-spacing:0.01em; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; display:block; }

  .card{
    background:transparent;
    border:none;
    border-bottom:1px solid #ECEEF1;
    border-radius:0;
    padding:0 0 22px;
    margin-bottom:22px;
    box-shadow:none;
  }
  .card h2{ font-size:1.3rem; margin-bottom:4px; }
  .subtext{ color:var(--sand-dim); font-size:0.9rem; margin-bottom:18px; line-height:1.5; }
  .hint{ color:var(--sand-dim); font-size:0.76rem; margin-top:4px; line-height:1.4; }

  label{ display:block; font-size:0.82rem; color:var(--sand-dim); margin:14px 0 6px; }
  input, select, textarea{
    width:100%; padding:11px 12px; border-radius:9px;
    border:1px solid rgba(237,225,196,0.18);
    background:var(--surface2); color:var(--sand);
    font-family:'Space Grotesk', sans-serif; font-size:0.96rem;
    outline:none; transition:border-color .15s;
  }
  textarea{ resize:vertical; min-height:80px; font-family:'Space Grotesk'; }
  input:focus, select:focus, textarea:focus{ border-color:var(--gold); }
  input[type=file]{ padding:8px; font-size:0.85rem; }
  input[type=checkbox]{ width:auto; margin-right:8px; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:58px; }
  .pw-toggle{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--gold); font-size:0.72rem; font-weight:700; padding:6px 8px; margin:0; cursor:pointer; }
  .checkline{ display:flex; align-items:center; margin-top:14px; font-size:0.88rem; color:var(--sand); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:520px){ .row3{ grid-template-columns:1fr; } .row2{grid-template-columns:1fr;} }

  button{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:0.94rem;
    border:none; border-radius:9px; padding:12px 18px; cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  button:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--gold); color:var(--on-accent); width:100%; margin-top:20px; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--sand-dim); border:1px solid rgba(237,225,196,0.18); width:100%; margin-top:10px; }
  .btn-ghost:hover{ color:var(--sand); border-color:var(--gold-dim); }
  .btn-sm{ padding:8px 14px; font-size:0.85rem; width:auto; margin-top:10px; }
  .link-btn{ background:none; border:none; color:var(--gold); text-decoration:underline; cursor:pointer; font-size:0.85rem; padding:0; }
  a.dl, button.dl{ color:var(--gold); text-decoration:underline; font-size:0.85rem; background:none; border:none; padding:0; margin:0; cursor:pointer; font-family:'Space Grotesk',sans-serif; }

  .file-preview-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:10000;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .file-preview-modal{
    background:var(--surface); width:100%; max-width:760px; max-height:88vh;
    border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden;
  }
  .file-preview-header{
    display:flex; justify-content:space-between; align-items:center; padding:14px 16px;
    border-bottom:1px solid rgba(212,162,76,0.16); font-weight:600; color:var(--sand);
  }
  .file-preview-header button{ background:none; border:none; color:var(--sand-dim); font-size:1.1rem; padding:4px 8px; margin:0; cursor:pointer; }
  .file-preview-body{ overflow:auto; padding:14px; flex:1; text-align:center; }
  .file-preview-body img{ max-width:100%; border-radius:8px; }
  .file-preview-body iframe{ width:100%; height:65vh; border:none; border-radius:8px; background:#fff; }
  .file-preview-footer{ padding:12px 16px; border-top:1px solid rgba(212,162,76,0.16); }

  .role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;}
  .role-card{ background:var(--surface); border:1px solid rgba(212,162,76,0.16); border-radius:var(--radius); padding:22px 16px; text-align:center; cursor:pointer; transition:.15s; }
  .role-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .role-card .ic{ font-size:1.8rem; margin-bottom:8px; }
  .role-card h3{ font-size:1.05rem; }
  .role-card p{ color:var(--sand-dim); font-size:0.8rem; margin-top:4px; }

  .toggle-row{ display:flex; gap:8px; margin-bottom:6px; }
  .toggle-row button{ flex:1; background:var(--surface2); color:var(--sand-dim); }
  .toggle-row button.active{ background:var(--gold); color:var(--on-accent); }

  .err{ color:var(--sting); font-size:0.82rem; margin-top:10px; min-height:1em; }
  .ok{ color:var(--sage); font-size:0.82rem; margin-top:10px; }

  .exam-item{ padding:14px 0; border-bottom:1px solid rgba(237,225,196,0.08); }
  .exam-item:last-child{ border-bottom:none; }
  .exam-item .row{ display:flex; justify-content:space-between; align-items:center; }
  .exam-item .code{ background:var(--surface2); color:var(--gold); padding:3px 8px; border-radius:6px; font-size:0.8rem; }
  .exam-actions{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .exam-actions button{ padding:7px 12px; font-size:0.78rem; margin-top:0; }
  .badge{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:0.72rem; font-weight:600; }
  .badge-live{ background:var(--sage-dim); color:var(--sage); }
  .badge-upcoming{ background:var(--gold-dim); color:var(--gold); }
  .badge-closed{ background:var(--sting-dim); color:#D98873; }
  .type-tag{ display:inline-block; font-size:0.68rem; padding:2px 7px; border-radius:5px; margin-left:6px; text-transform:uppercase; letter-spacing:.04em; }
  .type-mcq{ background:var(--sage-dim); color:var(--sage); }
  .type-upload{ background:var(--gold-dim); color:var(--gold); }
  .type-text{ background:rgba(193,67,43,0.18); color:#E38C79; }

  .qcount{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .progress{ height:6px; background:var(--surface2); border-radius:4px; overflow:hidden; margin-bottom:22px; }
  .progress-fill{ height:100%; background:var(--gold); transition:width .3s ease; }

  .option{ display:block; width:100%; text-align:left; padding:13px 14px; margin-bottom:10px; border-radius:9px;
    background:var(--surface2); border:1px solid rgba(237,225,196,0.14); color:var(--sand); font-family:'Space Grotesk'; font-size:0.95rem; cursor:pointer; }
  .option:hover{ border-color:var(--gold); }
  .option.correct{ background:var(--sage-dim); border-color:var(--sage); color:var(--sage); }
  .option.wrong{ background:var(--sting-dim); border-color:var(--sting); color:#E38C79; }
  .option[disabled]{ cursor:default; }

  .toast{
    position:fixed; top:22px; left:50%; transform:translateX(-50%) translateY(-20px);
    padding:12px 22px; border-radius:10px; font-weight:600; font-size:0.9rem;
    opacity:0; transition:all .25s ease; z-index:50; box-shadow:0 6px 20px var(--shadow-color);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.good{ background:var(--sage); color:#12210b; }
  .toast.bad{ background:var(--sting); color:#2a0d08; }
  .toast.info{ background:var(--gold); color:var(--on-accent); }

  .qbuilder-item{ background:var(--surface2); border-radius:10px; padding:14px; margin-bottom:10px; font-size:0.88rem; }
  .qbuilder-item .qtop{ display:flex; justify-content:space-between; align-items:center; color:var(--sand-dim); font-size:0.75rem; margin-bottom:6px;}
  .remove-x{ background:none; border:none; color:var(--sting); cursor:pointer; font-size:0.8rem; padding:0; }

  .who{ font-size:0.85rem; color:var(--sand-dim); }
  .who b{ color:var(--sand); }
  .logout{ background:none; border:none; color:var(--sand-dim); text-decoration:underline; cursor:pointer; font-size:0.8rem; }

  .score-hero{ text-align:center; padding:30px 20px; }
  .score-hero .big{ font-family:'Fraunces', serif; font-size:3.4rem; color:var(--gold); }
  .score-hero .msg{ color:var(--sand-dim); margin-top:8px; }

  .spinner{ width:18px; height:18px; border:2px solid rgba(237,225,196,0.2); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .center{ text-align:center; padding:40px 0; color:var(--sand-dim); }

  .learner-row{ border-bottom:1px solid rgba(237,225,196,0.08); padding:16px 0; }
  .learner-row:last-child{ border-bottom:none; }
  .qmark{ background:var(--surface2); border-radius:9px; padding:12px; margin:8px 0; }
  .qmark .prompt{ margin-bottom:8px; }
  .marks-input{ width:80px; display:inline-block; margin:0 0 0 8px; }

  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:56px; z-index:500;
    background:var(--sidebar-bg); display:flex; flex-direction:column; align-items:center;
    padding:14px 0; gap:8px;
  }
  .sidebar button{
    background:transparent; border:none; color:var(--sidebar-text); font-size:1.25rem;
    width:40px; height:40px; border-radius:10px; cursor:pointer; margin:0; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar button:active{ background:rgba(255,255,255,0.18); }
  .sidebar button.active{ background:rgba(255,255,255,0.22); }
  .sidebar .sidebar-spacer{ flex:1; }
  .sidebar-scrim{
    display:none; position:fixed; inset:0; background:rgba(20,30,60,0.35); z-index:498;
  }
  .sidebar-scrim.open{ display:block; }
  .sidebar-drawer{
    position:fixed; left:56px; top:0; bottom:0; width:220px; z-index:499;
    background:var(--sidebar-bg); padding:70px 12px 20px; overflow-y:auto;
    transform:translateX(-110%); transition:transform .25s ease;
  }
  .sidebar-drawer.open{ transform:translateX(0); }
  .sidebar-drawer button, .sidebar-drawer a{
    display:block; width:100%; text-align:left; background:rgba(255,255,255,0.1);
    color:var(--sidebar-text); border:none; padding:12px 14px; margin:0 0 8px; border-radius:9px;
    font-size:0.88rem; text-decoration:none; box-sizing:border-box;
  }
  .settings-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 4px; cursor:pointer; border-bottom:1px solid rgba(237,225,196,0.1); font-weight:600; }
  .settings-row:last-of-type{ border-bottom:none; }

  table.resulttable{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  table.resulttable th{ text-align:left; color:var(--sand-dim); font-size:0.72rem; text-transform:uppercase; letter-spacing:.04em; padding:8px 6px; border-bottom:1px solid rgba(237,225,196,0.14); }
  table.resulttable td{ padding:10px 6px; border-bottom:1px solid rgba(237,225,196,0.08); }
  .rating{ display:inline-block; padding:3px 9px; border-radius:6px; font-size:0.72rem; font-weight:700; }
  .rating-BE{ background:var(--sting-dim); color:#E38C79; }
  .rating-AE{ background:var(--gold-dim); color:var(--gold); }
  .rating-ME{ background:var(--sage-dim); color:var(--sage); }
  .rating-EE{ background:#2C4F6B; color:#8FC3E8; }
  .rank-1{ color:var(--gold); font-weight:700; }
  .timer-badge{ text-align:center; font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--gold); background:var(--surface2); border-radius:8px; padding:8px; margin-bottom:16px; }

  #splash-screen{
    position:fixed; inset:0; z-index:20000; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity .4s ease;
  }
  #splash-screen.fade{ opacity:0; pointer-events:none; }

  #top-loader{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:var(--gold); z-index:9999; opacity:0;
    transition: width .3s ease, opacity .25s ease;
  }
  #top-loader.active{ opacity:1; width:80%; }

  .install-banner{
    position:fixed; left:12px; right:12px; bottom:12px; z-index:9998;
    background:var(--surface); border:1px solid rgba(212,162,76,0.3);
    border-radius:14px; box-shadow:0 10px 30px var(--shadow-color);
    padding:12px 12px 12px 14px; display:flex; align-items:center; gap:12px;
    transition: transform .3s ease, opacity .3s ease;
  }
  .install-banner.hidden{ transform:translateY(140%); opacity:0; pointer-events:none; }
  .install-banner img{ width:40px; height:40px; border-radius:10px; flex-shrink:0; }
  .install-banner-text{ flex:1; display:flex; flex-direction:column; font-size:0.8rem; color:var(--sand-dim); min-width:0; }
  .install-banner-text b{ color:var(--sand); font-size:0.9rem; }
  .install-banner-close{ background:none; border:none; color:var(--sand-dim); font-size:0.95rem; padding:4px 6px; margin:0; cursor:pointer; align-self:flex-start; }
</style>
</head>

  <svg viewBox="0 0 120 70" fill="none" style="width:90px;height:56px;">

    <path d="M102,46 Q116,40 112,26 Q110,18 100,20" stroke="var(--gold)" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="60" cy="42" rx="22" ry="14" fill="var(--gold)"/>
    <circle cx="60" cy="42" r="6" fill="var(--on-accent)"/>
    <path d="M78,36 Q96,30 100,16 Q102,8 92,4" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="86" cy="26" r="3" fill="var(--gold)"/>
    <circle cx="94" cy="15" r="3" fill="var(--gold)"/>

  <h1 style="font-family:'Fraunces',serif;color:var(--sand);font-size:1.7rem;margin:14px 0 6px;">Math Scorpion</h1>

<div id="top-loader"></div>
<div id="install-banner" class="install-banner hidden">
  <img src="icon-192.png" alt="">

  <button id="install-banner-btn" class="btn-primary" style="width:auto;margin:0;padding:9px 16px;">Install</button>

<script>
/* =========================================================================
   FIREBASE SETUP — paste your config from the Firebase console here.
   1. https://console.firebase.google.com → Add project (free).
   2. Build → Firestore Database → Create database → Start in TEST MODE.
   3. Gear icon → Project settings → scroll to "Your apps" → click </> (web) → register an app.
   4. Copy the firebaseConfig object shown there and paste the values below.
   5. Save, re-upload to GitHub as index.html — Vercel redeploys automatically.
   Test-mode rules are open to anyone and expire after 30 days — fine for now,
   tighten them under Firestore → Rules before real classroom use.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDkqcZQ72WW_G5Vke0i9xqVixnHXpbsmnU",
  authDomain: "scorpion-john.firebaseapp.com",
  projectId: "scorpion-john",
  storageBucket: "scorpion-john.firebasestorage.app",
  messagingSenderId: "672422036135",
  appId: "1:672422036135:web:3a3aa374adcea5ee409182"
};

/* CHANGE THIS to your own secret before deploying — this is the password for the
   hidden superadmin view (platform-wide stats). Only you should know it. */
const ADMIN_PASSWORD = "scorpion-admin-2026";

let db = null, firebaseReady = false;
try{
  if(firebaseConfig.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
}catch(e){ console.error('Firebase init failed', e); }

/* ---------- thin top loading bar ---------- */
let loaderPending = 0, loaderHideTimeout = null;
function loaderShow(){
  loaderPending++;
  if(loaderHideTimeout){ clearTimeout(loaderHideTimeout); loaderHideTimeout=null; }
  const el = document.getElementById('top-loader');
  if(el){ el.style.width = '0%'; requestAnimationFrame(()=> el.classList.add('active')); }
}
function loaderHide(){
  loaderPending = Math.max(0, loaderPending-1);
  if(loaderPending>0) return;
  const el = document.getElementById('top-loader');
  if(!el) return;
  el.style.width = '100%';
  loaderHideTimeout = setTimeout(()=>{ el.classList.remove('active'); el.style.width='0%'; }, 250);
}

/* ---------- storage helpers, backed by Firestore (shared across every device) ---------- */
async function sGet(key){
  if(!db) return null;
  loaderShow();
  try{
    const snap = await db.collection('appdata').doc(key).get();
    return snap.exists ? snap.data().value : null;
  }catch(e){ console.error('storage get failed', e); return null; }
  finally{ loaderHide(); }
}
async function sSet(key, val){
  if(!db) return null;
  loaderShow();
  try{
    await db.collection('appdata').doc(key).set({ value: val, updatedAt: Date.now() });
    return true;
  }catch(e){ console.error('storage set failed', e); return null; }
  finally{ loaderHide(); }
}
async function sList(prefix){
  if(!db) return [];
  loaderShow();
  try{
    const snaps = await db.collection('appdata')
      .orderBy(firebase.firestore.FieldPath.documentId())
      .startAt(prefix).endAt(prefix + '\uf8ff')
      .get();
    return snaps.docs.map(d=>d.id);
  }catch(e){ console.error('storage list failed', e); return []; }
  finally{ loaderHide(); }
}

function keyify(s){ return s.trim().toLowerCase().replace(/\s+/g,''); }

function genCode(existing){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code;
  do{
    let tail = "";
    for(let i=0;i<3;i++) tail += chars[Math.floor(Math.random()*chars.length)];
    code = "MS" + tail;
  } while(existing.has(code));
  return code;
}

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    if(file.size > MAX_FILE_BYTES){ reject(new Error('File is too large — please keep it under 350KB (the shared database has a size limit).')); return; }
    const r = new FileReader();
    r.onload = ()=> resolve({ name:file.name, type:file.type, dataUrl:r.result });
    r.onerror = ()=> reject(new Error('Could not read that file.'));
    r.readAsDataURL(file);
  });
}

/* ---------- live math preview: type plain syntax like 1/2 or 2^2, see it rendered as real math below ---------- */
function autoMathify(raw){
  if(!raw) return raw;
  let s = raw;
  s = s.replace(/sqrt\(([^)]+)\)/gi, (m, inner) => '$\\sqrt{'+inner+'}$');
  s = s.replace(/(\d+)\/(\d+)/g, (m, a, b) => '$\\frac{'+a+'}{'+b+'}$');
  s = s.replace(/(\w+)\^\(([^)]+)\)/g, (m, base, exp) => '$'+base+'^{'+exp+'}$');
  s = s.replace(/(\w+)\^(-?\w+)/g, (m, base, exp) => '$'+base+'^{'+exp+'}$');
  s = s.replace(/(\w+)_\(([^)]+)\)/g, (m, base, sub) => '$'+base+'_{'+sub+'}$');
  s = s.replace(/(\w+)_(-?\w+)/g, (m, base, sub) => '$'+base+'_{'+sub+'}$');
  return s;
}
function updateLivePreview(rawValue, previewElId){
  const el = document.getElementById(previewElId);
  if(!el) return;
  if(!rawValue || !rawValue.trim()){ el.innerHTML = ''; return; }
  el.innerHTML = autoMathify(rawValue);
  if(window.renderMathInElement){
    try{ renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]}); }catch(e){}
  }
}

function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 1800);
}

window._previewFiles = window._previewFiles || {};
/* ---------- multi-file helpers (also read old single-file data safely) ---------- */
function asFileArray(x){
  if(!x) return [];
  return Array.isArray(x) ? x : [x];
}
async function pickFiles(inputEl){
  const files = Array.from(inputEl.files||[]);
  const out = [];
  for(const file of files){
    try{ out.push(await readFileAsDataURL(file)); }
    catch(e){ toast(e.message, 'bad'); }
  }
  return out;
}
function filesListHTML(filesOrFile, prefix){
  const arr = asFileArray(filesOrFile);
  if(arr.length===0) return `<div class="hint">(no file attached)</div>`;
  return arr.map(f=> fileBtn(f, (prefix?prefix+': ':'')+f.name)).join('<br>');
}

function hasPaper(exam){ return asFileArray(exam.paperFiles||exam.paperFile).length>0; }
function avatarHTML(name, photo, size){
  size = size || 40;
  if(photo && photo.dataUrl) return `<img src="${photo.dataUrl}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex-shrink:0;">`;
  const letter = (name||'?').trim().charAt(0).toUpperCase() || '?';
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--gold);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:${Math.round(size*0.45)}px;">${letter}</div>`;
}
function fileBtn(file, label){
  if(!file || !file.dataUrl) return '';
  const key = 'f'+Math.random().toString(36).slice(2,10);
  window._previewFiles[key] = file;
  const text = label || file.name || 'file';
  return `<button type="button" class="dl" onclick="previewFile('${key}')">📄 ${text}</button>`;
}
function previewFile(key){
  const file = window._previewFiles[key];
  if(!file) return;
  const type = file.type || (file.dataUrl.match(/^data:([^;]+);/)||[])[1] || '';
  let body;
  if(type.startsWith('image/')) body = `<img src="${file.dataUrl}">`;
  else if(type==='application/pdf') body = `<iframe src="${file.dataUrl}"></iframe>`;
  else body = `<p class="hint">Preview isn't available for this file type — use download instead.</p>`;
  const overlay = document.createElement('div');
  overlay.className = 'file-preview-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="file-preview-modal">
      <div class="file-preview-header">
        <span>${file.name||'File'}</span>
        <button onclick="this.closest('.file-preview-overlay').remove()">✕ Close</button>
      </div>
      <div class="file-preview-body">${body}</div>
      <div class="file-preview-footer">
        <a class="btn-ghost btn-sm" href="${file.dataUrl}" download="${file.name||'file'}">⬇ Download instead</a>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function learnerSignup(){
  const fullNameVal=val('ls-fullname'), username=val('ls-username'), school=val('ls-school'),
        grade=val('ls-grade'), email=val('ls-email'), pass=val('ls-pass'), pass2=val('ls-pass2');
  if(!fullNameVal||!username||!school||!email||!pass||!pass2){ setErr('Please fill in every field.'); return; }
  if(!USERNAME_RE.test(username)){ setErr('Username needs at least 3 letters followed by a number, e.g. mwiz01.'); return; }
  if(!validPassword(pass)){ setErr('Password must be at least 4 characters with a mix of letters and numbers.'); return; }
  if(pass!==pass2){ setErr('Passwords do not match.'); return; }
  const uk = keyify(username);
  const nk = keyify(fullNameVal);
  const takenUser = await sGet('learner:'+uk);
  if(takenUser){ setErr('That username is taken — pick another.'); return; }
  const takenName = await sGet('learnername:'+nk);
  if(takenName){ setErr('An account with that name already exists — try logging in.'); return; }
  const learner = { fullName: fullNameVal, username, school, grade, email, password: pass, theme:'cream' };
  await sSet('learner:'+uk, learner);
  await sSet('learnername:'+nk, { usernameKey: uk });
  toast('Account created — welcome!', 'good');
  applyTheme('cream');
  go('learnerDashboard', { learner });
}
async function resolveLearner(identifier){
  const k = keyify(identifier);
  let learner = await sGet('learner:'+k);
  let key = k;
  if(!learner){
    const map = await sGet('learnername:'+k);
    if(map){ learner = await sGet('learner:'+map.usernameKey); key = map.usernameKey; }
  }
  return { learner, key };
}
async function learnerLogin(){
  const id=val('ll-name'), pass=val('ll-pass');
  if(!id||!pass){ setErr('Enter your name or username, and your password.'); return; }
  const { learner } = await resolveLearner(id);
  if(!learner || learner.password !== pass){ setErr('Name/username or password is incorrect.'); return; }
  applyTheme(learner.theme==='dark' ? 'dark' : 'cream');
  go('learnerDashboard', { learner });
}

async function startAssignment(code){

  const startIndex = hasPaper(exam) ? -1 : 0;

}
/* ================= PRACTICE MODE (untimed, ungraded, unlimited retakes) ================= */
let practiceQuestions = [], practiceIndex = 0, practiceScore = 0, practiceAnswered = null, practiceGiven = null, practiceCorrect = false, practiceTopic = '';
async function startPractice(){
  const topicEl = document.getElementById('pr-topic');
  const topic = topicEl ? topicEl.value : practiceTopic;
  const keys = await sList('exam:');
  const all = (await Promise.all(keys.map(k=>sGet(k)))).filter(Boolean);
  const matching = all.filter(e => String(e.grade)===String(state.learner.grade) && e.topic===topic && sameSchool(e.school, state.learner.school));
  let pool = [];
  matching.forEach(e => e.questions.forEach(q => { if(q.type==='mcq' || q.type==='short') pool.push(q); }));
  if(pool.length===0){
    const el = document.getElementById('pr-err');
    if(el) el.textContent = 'No practice questions found yet for '+topic+' at your grade.';
    return;
  }
  practiceQuestions = pool.sort(()=>Math.random()-0.5).slice(0,15);
  practiceTopic = topic; practiceIndex = 0; practiceScore = 0; practiceAnswered = null; practiceGiven = null;
  go('practiceQuiz');
}
function practiceQuizView(){
  const q = practiceQuestions[practiceIndex];
  const pct = Math.round((practiceIndex/practiceQuestions.length)*100);
  let body;
  if(q.type==='mcq'){
    body = q.options.map((opt,i)=>{
      let cls='option';
      if(practiceAnswered!==null){
        if(i===q.correctIndex) cls+=' correct';
        else if(i===practiceGiven) cls+=' wrong';
      }
      const disabled = practiceAnswered!==null ? 'disabled' : '';
      return `<button class="${cls}" ${disabled} onclick="answerPracticeMCQ(${i})">${opt}</button>`;
    }).join('');
  } else {
    body = `
      <input id="practice-short-input" value="${practiceGiven||''}" ${practiceAnswered!==null?'disabled':''} placeholder="Type your answer" oninput="practiceGiven=this.value">
      ${practiceAnswered!==null
        ? `<div class="hint" style="margin-top:8px;">${practiceCorrect ? '✅ Correct' : '❌ Accepted answer(s): '+q.acceptedAnswers.join(', ')}</div>`
        : `<button class="btn-ghost btn-sm" style="margin-top:10px;" onclick="answerPracticeShort()">Check answer</button>`}`;
  }
  return `
  ${brandHTML()}
  <div class="card">
    <div class="qcount"><span class="subtext" style="margin:0;">Practice · ${practiceTopic}</span><span class="subtext" style="margin:0;">Question ${practiceIndex+1} / ${practiceQuestions.length}</span></div>
    <div class="progress"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <h2 style="margin-bottom:16px;">${q.text}</h2>
    ${q.image ? `<img src="${q.image.dataUrl}" style="max-width:100%; border-radius:9px; margin-bottom:14px;">` : ''}
    ${body}
    ${practiceAnswered!==null ? `<button class="btn-primary" style="margin-top:14px;" onclick="nextPractice()">${practiceIndex+1===practiceQuestions.length?'Finish':'Next question'}</button>` : ''}
  </div>
  <button class="btn-ghost" onclick="go('learnerDashboard')">Exit practice</button>`;
}
function answerPracticeMCQ(i){
  const q = practiceQuestions[practiceIndex];
  practiceAnswered = true; practiceGiven = i;
  practiceCorrect = (i===q.correctIndex);
  if(practiceCorrect){ practiceScore++; toast('Correct! 🎉', 'good'); }
  else toast('Not quite — correct answer highlighted', 'bad');
  render();
}
function answerPracticeShort(){
  const q = practiceQuestions[practiceIndex];
  const given = practiceGiven || '';
  if(!given.trim()){ toast('Type an answer first.', 'bad'); return; }
  practiceAnswered = true;
  practiceCorrect = isShortAnswerCorrect(given, q.acceptedAnswers||[]);
  if(practiceCorrect){ practiceScore++; toast('Correct! 🎉', 'good'); }
  else toast('Not quite — see accepted answer', 'bad');
  render();
}
function nextPractice(){
  if(practiceIndex+1 < practiceQuestions.length){ practiceIndex++; practiceAnswered=null; practiceGiven=null; render(); return; }
  recordActivity();
  go('practiceResult');
}
function practiceResultView(){
  return `
  ${brandHTML()}
  <div class="card score-hero">
    <div class="eyebrow">Practice · ${practiceTopic}</div>
    <div class="big">${practiceScore}/${practiceQuestions.length}</div>
    <div class="msg">This doesn't count anywhere — practice as much as you like.</div>
  </div>
  <button class="btn-primary" onclick="startPractice()">Practice again</button>
  <button class="btn-ghost" onclick="go('learnerDashboard')">Back to dashboard</button>`;
}

async function enterExamCode(){
  const code = val('ec-code').toUpperCase().trim();
  if(!code){ setErr('Enter a code.'); return; }
  const exam = await sGet('exam:'+code);
  if(!exam){ setErr('No exam found with that code.'); return; }
  const now = Date.now();
  const openAt = new Date(exam.openAt).getTime();
  const closeAt = openAt + exam.durationMinutes*60000;
  const rk = 'examresult:'+code+':'+keyify(fullName(state.learner));
  const prior = await sGet(rk);
  if(prior){ go('examResult', { activeExam: exam, feedback: prior }); return; }
  if(now < openAt){ setErr('This exam opens at '+new Date(openAt).toLocaleString()+'.'); return; }
  if(now > closeAt){ setErr('This exam has closed.'); return; }
  const startIndex = hasPaper(exam) ? -1 : 0;
  startExamTimers();
  go('examTaking', { activeExam: exam, qIndex:startIndex, answers:new Array(exam.questions.length).fill(null), paperAnswerFiles:[], shortLocked:{}, shortCorrect:{} });
}

/* ---------- countdown timer (also syncs extra time a teacher adds mid-exam) ---------- */
let examTimerInterval = null, examTimerTick = 0;
function formatRemaining(exam){
  const closeAt = new Date(exam.openAt).getTime() + exam.durationMinutes*60000;
  const remaining = closeAt - Date.now();
  if(remaining<=0) return "Time's up";
  const mm = Math.floor(remaining/60000), ss = Math.floor((remaining%60000)/1000);
  return mm+':'+String(ss).padStart(2,'0')+' remaining';
}
function startExamTimers(){
  examTimerTick = 0;
  if(examTimerInterval) clearInterval(examTimerInterval);
  examTimerInterval = setInterval(examTimerLoop, 1000);
}
async function examTimerLoop(){
  const el = document.getElementById('exam-countdown');
  if(!el || !state.activeExam){ clearInterval(examTimerInterval); examTimerInterval=null; return; }
  examTimerTick++;
  if(examTimerTick % 20 === 0){
    const latest = await sGet('exam:'+state.activeExam.code);
    if(latest) state.activeExam.durationMinutes = latest.durationMinutes;
  }
  const exam = state.activeExam;
  const closeAt = new Date(exam.openAt).getTime() + exam.durationMinutes*60000;
  if(closeAt - Date.now() <= 0){
    clearInterval(examTimerInterval); examTimerInterval=null;
    toast("Time's up — submitting your exam", 'info');
    finishExam();
    return;
  }
  el.textContent = formatRemaining(exam);
}

function examTakingView(){
  const exam = state.activeExam;
  if(state.qIndex === -1) return examPaperStepView(exam);
  const q = exam.questions[state.qIndex];
  const pct = Math.round((state.qIndex/exam.questions.length)*100);

  return `
  ${brandHTML()}
  <div class="card">
    ${exam.untimed ? '<div class="hint" style="text-align:center;margin-bottom:12px;">Homework · due '+new Date(exam.dueAt).toLocaleString()+'</div>' : `<div id="exam-countdown" class="timer-badge">${formatRemaining(exam)}</div>`}
    <div class="qcount"><span class="subtext" style="margin:0;">${exam.title}</span><span class="subtext" style="margin:0;">${questionHeading(q,state.qIndex)} of ${exam.questions.length}</span></div>
    <div class="progress"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <h2 style="margin-bottom:6px;">${q.text}<span class="type-tag type-${q.type}">${typeLabel(q.type)}</span></h2>
    ${q.image ? `<img src="${q.image.dataUrl}" style="max-width:100%; border-radius:9px; margin:10px 0;">` : ''}
    ${q.type!=='mcq' ? `<p class="subtext" style="margin-top:8px;">Marked by your teacher · worth ${q.points||1} point${(q.points||1)>1?'s':''}</p>` : ''}

      <button class="btn-primary" style="flex:2;" onclick="nextQuestion()">${isLast?'Review answers':'Next question'}</button>
    </div>
  </div>`;
}
function normalizeAnswer(s){
  return (s||'').toString().trim().toLowerCase().replace(/\s+/g,'').replace(/^x=/,'');
}
function isShortAnswerCorrect(given, accepted){
  const g = normalizeAnswer(given);
  if(!g) return false;
  return (accepted||[]).some(a => normalizeAnswer(a) === g);
}
function typeLabel(t){ return t==='mcq'?'Multiple choice': t==='short'?'Short answer': t==='upload'?'File upload': 'Written answer'; }
function questionHeading(q, idx){
  return (q.groupLabel && q.partLabel) ? q.groupLabel+' ('+q.partLabel+')' : 'Q'+(idx+1);
}

function questionInputHTML(q, idx){
  if(q.type==='mcq'){
    const picked = state.answers[idx];
    return q.options.map((opt,i)=>{
      let cls='option';
      if(picked!==null && picked!==undefined){
        if(i===q.correctIndex) cls+=' correct';
        else if(i===picked) cls+=' wrong';
      }
      const disabled = (picked!==null && picked!==undefined) ? 'disabled' : '';
      return `<button class="${cls}" ${disabled} onclick="answerMCQ(${i})">${opt}</button>`;
    }).join('');
  }
  if(q.type==='short'){
    const locked = state.shortLocked && state.shortLocked[idx];
    const a = state.answers[idx] || '';
    return `
      <input id="short-input-${idx}" value="${a}" ${locked?'disabled':''} placeholder="Type your answer" oninput="state.answers[${idx}]=this.value; updateLivePreview(this.value,'short-preview-${idx}')">
      <div id="short-preview-${idx}" class="hint" style="min-height:1.2em;"></div>
      ${locked
        ? `<div class="hint" style="margin-top:8px;">${state.shortCorrect[idx] ? '✅ Correct' : '❌ Not quite — accepted answer(s): '+q.acceptedAnswers.join(', ')}</div>`
        : `<button class="btn-ghost btn-sm" style="margin-top:10px;" onclick="checkShortAnswer(${idx})">Check answer</button>`}`;
  }
  if(q.type==='upload'){
    const files = asFileArray(state.answers[idx]);
    return `
      <input type="file" multiple onchange="answerUpload(this, ${idx})">
      <div id="upload-status-${idx}" class="hint">${files.length ? 'Attached: '+files.map(f=>f.name).join(', ') : 'No file attached yet.'}</div>`;
  }
  // text
  const a = state.answers[idx] || '';
  return `<textarea placeholder="Write your explanation here..." oninput="state.answers[${idx}]=this.value">${a}</textarea>`;
}
function checkShortAnswer(idx){
  const q = state.activeExam.questions[idx];
  const given = state.answers[idx]||'';
  if(!given.trim()){ toast('Type an answer first.', 'bad'); return; }
  if(!state.shortLocked) state.shortLocked = {};
  if(!state.shortCorrect) state.shortCorrect = {};
  const correct = isShortAnswerCorrect(given, q.acceptedAnswers||[]);
  state.shortLocked[idx] = true;
  state.shortCorrect[idx] = correct;
  toast(correct ? 'Correct! 🎉' : 'Not quite — see accepted answer', correct?'good':'bad');
  render();
}

function answerMCQ(i){
  const exam = state.activeExam;
  const q = exam.questions[state.qIndex];
  state.answers[state.qIndex] = i;
  if(i===q.correctIndex) toast('Correct! 🎉', 'good');
  else toast('Not quite — correct answer highlighted', 'bad');
  render();
}
async function answerUpload(inputEl, idx){
  const newFiles = await pickFiles(inputEl);
  if(newFiles.length===0) return;
  if(!Array.isArray(state.answers[idx])) state.answers[idx] = asFileArray(state.answers[idx]);
  state.answers[idx].push(...newFiles);
  document.getElementById('upload-status-'+idx).textContent = 'Attached: '+state.answers[idx].map(f=>f.name).join(', ');
  toast(newFiles.length>1 ? newFiles.length+' files attached' : 'File attached', 'good');
}

function prevQuestion(){

function examReviewView(){

    ${exam.questions.map((q,i)=>{

      </div>`;

async function finishExam(){
  if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval=null; }
  const exam = state.activeExam;
  let autoScore=0, autoTotal=0, manualTotal=0;
  exam.questions.forEach((q,i)=>{
    if(q.type==='mcq'){ autoTotal++; if(state.answers[i]===q.correctIndex) autoScore++; }
    else if(q.type==='short'){ autoTotal++; if(isShortAnswerCorrect(state.answers[i], q.acceptedAnswers||[])) autoScore++; }
    else { manualTotal += (q.points||1); }
  });
  const result = {
    learner: fullName(state.learner), code: exam.code,
    examTitle: exam.title, examGrade: exam.grade, examTopic: exam.topic,
    answers: state.answers,
    paperAnswerFiles: asFileArray(state.paperAnswerFiles),
    autoScore, autoTotal, manualTotal, marks:{},
    submittedAt: new Date().toISOString()
  };
  await sSet('examresult:'+exam.code+':'+keyify(fullName(state.learner)), result);
  await recordActivity();
  go('examResult', { activeExam: exam, feedback: result });
}

function readOnlyQuestionHTML(q, answer, markInfo){
  if(q.type==='mcq'){
    return q.options.map((opt,i)=>{
      let cls='option';
      if(i===q.correctIndex) cls+=' correct';
      else if(i===answer) cls+=' wrong';
      return `<div class="${cls}">${opt}</div>`;
    }).join('');

  if(q.type==='short'){

  }
  const body = q.type==='upload' ? filesListHTML(answer) : `<div class="hint" style="white-space:pre-wrap;">${answer || '(no answer)'}</div>`;

}

/* ---------- enrich a stored result with exam context, marks, and a percentage/rating ---------- */
async function enrichResult(r){
  const exam = await sGet('exam:'+r.code);
  if(!exam) return { ...r, fullyMarked:false, pct:null, rating:null, untimed:false };
  let manualAwarded=0, manualComplete=true;
  exam.questions.forEach((q,i)=>{
    if(q.type==='mcq' || q.type==='short') return;
    if(r.marks && r.marks[i]!=null) manualAwarded += Number(r.marks[i]); else manualComplete=false;
  });
  let paperAwarded=0, paperComplete=true;
  if(hasPaper(exam)){
    if(r.marks && r.marks.paper!=null) paperAwarded = Number(r.marks.paper); else paperComplete=false;
  }
  const totalPossible = (r.autoTotal||0) + (r.manualTotal||0) + (hasPaper(exam) ? (exam.paperMaxMarks||0) : 0);
  const totalAwarded = (r.autoScore||0) + manualAwarded + paperAwarded;
  const fullyMarked = manualComplete && paperComplete;
  const pct = (fullyMarked && totalPossible>0) ? Math.round((totalAwarded/totalPossible)*100) : null;
  return { ...r, fullyMarked, totalPossible, totalAwarded, pct, rating: pct!==null ? ratingFor(pct) : null, untimed: !!exam.untimed };
}

async function startDM(presetUsername){
  const uname = presetUsername || val('nm-username');
  if(!uname){ setErr('Enter a username.'); return; }
  const uk = keyify(uname);
  const me = myIdentity();
  if(uk===me.usernameKey){ setErr("That's your own username."); return; }
  let targetName=null;
  const l = await sGet('learner:'+uk); if(l) targetName = fullName(l);
  if(!targetName){ const t = await sGet('teacher:'+uk); if(t) targetName = t.fullname; }
  if(!targetName){ setErr('No user found with that username.'); return; }
  const dmId = [me.usernameKey, uk].sort().join('_');
  const convoKey = 'dm:'+dmId;
  const existing = await sGet(convoKey);
  if(!existing){
    const names = {}; names[me.usernameKey]=me.name; names[uk]=targetName;
    await sSet(convoKey, { id:dmId, participants:[me.usernameKey, uk], names, createdAt:new Date().toISOString() });
    await sSet('dmindex:'+me.usernameKey+':'+dmId, { dmId });
    await sSet('dmindex:'+uk+':'+dmId, { dmId });
  }
  openChat(convoKey, targetName);
}

  const prefix = 'msg:'+convoKey+':';
  chatUnsubscribe = db.collection('appdata')
    .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
    .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff')
    .onSnapshot(

          .sort((a,b) => new Date(a.sentAt) - new Date(b.sentAt));
        renderChatMessagesList();
      },
      (err) => console.error('chat listener failed', err)
    );

function todayStr(){ return new Date().toISOString().slice(0,10); }
function streakBadge(streak){
  if(streak>=30) return { name:'Apex Scorpion', icon:'🦂' };
  if(streak>=14) return { name:'Stinger', icon:'🦂' };
  if(streak>=7) return { name:'Hunter', icon:'🦂' };
  if(streak>=3) return { name:'Scorpling', icon:'🦂' };
  return null;
}
async function recordActivity(){
  if(!state.learner) return;
  const today = todayStr();
  const learner = state.learner;
  if(learner.lastActiveDate === today) return; // already counted today
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  learner.currentStreak = (learner.lastActiveDate===yesterday) ? (learner.currentStreak||0)+1 : 1;
  learner.longestStreak = Math.max(learner.longestStreak||0, learner.currentStreak);
  learner.lastActiveDate = today;
  await sSet('learner:'+keyify(learner.username), learner);
}
function streakCardHTML(){
  const l = state.learner;
  const streak = l.currentStreak||0;
  const badge = streakBadge(streak);
  if(streak===0) return `<div class="card"><h2>Streak</h2><p class="subtext">Do an exam, homework, or practice round today to start your streak.</p></div>`;
  return `<div class="card score-hero">
    <div class="eyebrow">Streak</div>
    <div class="big">🔥 ${streak}</div>
    <div class="msg">day${streak===1?'':'s'} in a row${badge?' · '+badge.icon+' '+badge.name:''}</div>
    ${l.longestStreak>streak ? `<div class="hint" style="margin-top:6px;">Best ever: ${l.longestStreak} days</div>` : ''}

}

function examStatus(exam){
  if(exam.untimed){
    const overdue = exam.dueAt && Date.now() > new Date(exam.dueAt).getTime();
    return overdue ? {label:'Overdue', cls:'badge-closed'} : {label:'Homework', cls:'badge-upcoming'};
  }
  const now = Date.now(), openAt = new Date(exam.openAt).getTime(), closeAt = openAt+exam.durationMinutes*60000;
  if(now<openAt) return {label:'Upcoming', cls:'badge-upcoming'};
  if(now>closeAt) return {label:'Closed', cls:'badge-closed'};
  return {label:'Live', cls:'badge-live'};
}

async function attachPaperFile(inputEl){
  const newFiles = await pickFiles(inputEl);
  if(newFiles.length===0) return;
  if(!Array.isArray(state.examDraft.paperFiles)) state.examDraft.paperFiles = asFileArray(state.examDraft.paperFile);
  state.examDraft.paperFiles.push(...newFiles);
  state.examDraft.paperFile = null;
  document.getElementById('paper-file-name').textContent = 'Attached: '+state.examDraft.paperFiles.map(f=>f.name).join(', ');
  toast(newFiles.length>1 ? newFiles.length+' files attached' : 'File attached', 'good');
}

function syncDraft(){
  const d = state.examDraft;
  d.title = val('eb-title'); d.grade = val('eb-grade'); d.topic = val('eb-topic');
  const durEl = document.getElementById('eb-duration');
  if(durEl) d.durationMinutes = Number(durEl.value) || 30;
  const openEl = document.getElementById('eb-open');
  if(openEl) d.openAt = openEl.value;
  const dueEl = document.getElementById('eb-due');
  if(dueEl) d.dueAt = dueEl.value;
  const ins = document.getElementById('eb-instructions');
  if(ins) d.instructions = ins.value.trim();
  const cb = document.getElementById('eb-allow-upload');
  if(cb) d.allowPaperAnswerUpload = cb.checked;
  const pm = document.getElementById('eb-paper-max');
  if(pm) d.paperMaxMarks = Number(pm.value) || 0;
}

  const text = autoMathify(val('qb-text'));
  if(!text){ setErr('Write the question text.'); render(); return; }
  let q;

    const a=val('qb-a'), b=val('qb-b'), c=val('qb-c'), d2=val('qb-d'), correct=Number(val('qb-correct'));
    if(!a||!b||!c||!d2){ setErr('Fill in all four options.'); render(); return; }
    q = { id: Date.now()+Math.random(), type, text, options:[a,b,c,d2], correctIndex: correct, image: qbPendingImage||null };
  } else if(type==='short'){
    const acceptedAnswers = val('qb-shortanswers').split(',').map(s=>s.trim()).filter(Boolean);
    if(acceptedAnswers.length===0){ setErr('Give at least one accepted answer.'); render(); return; }
    q = { id: Date.now()+Math.random(), type, text, acceptedAnswers, image: qbPendingImage||null };
  } else {
    const points = Number(val('qb-points')) || 1;
    q = { id: Date.now()+Math.random(), type, text, points, image: qbPendingImage||null };
  }
  state.examDraft.questions.push(q);
  const mpCb = document.getElementById('qb-multipart');
  if(mpCb && mpCb.checked){
    const groupLabel = val('qb-grouplabel'), partLabel = val('qb-partlabel');
    if(groupLabel && partLabel){ q.groupLabel = groupLabel; q.partLabel = partLabel; }
  }
  if(document.getElementById('qb-savebank') && document.getElementById('qb-savebank').checked){
    const bankId = Date.now()+'_'+Math.random().toString(36).slice(2,8);
    await sSet('qbank:'+bankId, { ...q, id:bankId, grade: state.examDraft.grade, topic: state.examDraft.topic,
      teacherUsername: state.teacher.username, createdAt: new Date().toISOString() });

  }
  qbPendingImage = null;
  state.err='';
  render();
}

function randomUsernameFrom(fullNameVal, used){
  const first = (fullNameVal.trim().split(/\s+/)[0] || 'user').toLowerCase().replace(/[^a-z]/g,'') || 'user';
  let uname, tries=0;
  do{
    const digits = String(Math.floor(Math.random()*90)+10);
    uname = first + digits;
    tries++;
  } while(used.has(keyify(uname)) && tries<20);
  return uname;
}
function randomPassword(){
  const letters = 'abcdefghjkmnpqrstuvwxyz';
  const digits = '23456789';
  let p = '';
  for(let i=0;i<2;i++) p += letters[Math.floor(Math.random()*letters.length)];
  for(let i=0;i<2;i++) p += digits[Math.floor(Math.random()*digits.length)];
  return p;
}

    await sSet('learnername:'+nk, { usernameKey: uk });
    created.push({ name: fullNameVal, username, password, skipped:false });

let analyticsExam = null, analyticsData = [];
async function openExamAnalytics(code){
  analyticsExam = await sGet('exam:'+code);

  const keys = await sList('examresult:'+code+':');
  const results = (await Promise.all(keys.map(k=>sGet(k)))).filter(Boolean);
  analyticsData = analyticsExam.questions.map((q,i)=>{
    if(q.type!=='mcq') return { q, i, type:'manual' };
    let correct=0, attempted=0;
    results.forEach(r=>{
      if(r.answers[i]!==null && r.answers[i]!==undefined){ attempted++; if(r.answers[i]===q.correctIndex) correct++; }
    });
    const pct = attempted>0 ? Math.round((correct/attempted)*100) : null;
    return { q, i, type:'mcq', attempted, correct, pct };
  });
  go('examAnalytics');
}

/* ================= PDF EXPORT ================= */
async function downloadExamPdf(code){
  toast('Preparing PDF…', 'info');
  const exam = await sGet('exam:'+code);
  const keys = await sList('examresult:'+code+':');
  const results = (await Promise.all(keys.map(k=>sGet(k)))).filter(Boolean);
  if(!window.jspdf){ toast('PDF library did not load.', 'bad'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 15;
  doc.setFontSize(15); doc.text(exam.title+' — submissions', 10, y); y+=8;
  doc.setFontSize(10); doc.text('Code '+exam.code+' · Grade '+exam.grade+' · '+exam.topic, 10, y); y+=10;
  if(results.length===0){ doc.text('No submissions yet.', 10, y); }
  results.forEach(r=>{
    if(y>260){ doc.addPage(); y=15; }
    doc.setFontSize(12); doc.text(r.learner+'  —  auto: '+r.autoScore+'/'+r.autoTotal, 10, y); y+=7;
    doc.setFontSize(10);
    exam.questions.forEach((q,i)=>{
      if(q.type==='mcq' || q.type==='short') return;
      if(y>265){ doc.addPage(); y=15; }
      const lines = doc.splitTextToSize(questionHeading(q,i)+': '+stripMath(q.text), 185);
      doc.text(lines, 10, y); y += lines.length*5+2;
      if(q.type==='text'){
        const alines = doc.splitTextToSize('Answer: '+(r.answers[i]||'(no answer)'), 185);
        doc.text(alines, 10, y); y += alines.length*5+4;
      } else {
        const answers = asFileArray(r.answers[i]);
        if(answers.length===0){ doc.text('Answer: no file attached', 10, y); y+=6; }
        answers.forEach(ans=>{
          if(y>265){ doc.addPage(); y=15; }
          doc.text('Answer: uploaded file "'+ans.name+'"', 10, y); y+=6;
          if(ans.type && ans.type.startsWith('image/')){
            try{ doc.addImage(ans.dataUrl, undefined, 10, y, 60, 45); y+=50; }catch(e){}
          } else { y+=4; }
        });
      }
    });
    if(hasPaper(exam)){
      if(y>265){ doc.addPage(); y=15; }
      const ansFiles = asFileArray(r.paperAnswerFiles||r.paperAnswerFile);
      doc.text('Paper answer file(s): '+(ansFiles.length ? ansFiles.map(f=>f.name).join(', ') : 'not submitted'), 10, y); y+=8;
    }
    y+=6;
  });
  doc.save(exam.code+'-submissions.pdf');
  toast('PDF downloaded', 'good');
}
function stripMath(s){ return s.replace(/\$/g,''); }

function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
async function downloadExamCsv(code){
  toast('Preparing CSV…', 'info');
  const exam = await sGet('exam:'+code);
  if(!exam){ toast('Exam not found.', 'bad'); return; }
  const keys = await sList('examresult:'+code+':');
  const raw = (await Promise.all(keys.map(k=>sGet(k)))).filter(Boolean);
  const enriched = await Promise.all(raw.map(enrichResult));
  const header = ['Learner','Auto score','Auto total','Manual awarded','Manual total','Paper mark','Total %','Rating','Status','Submitted at'];
  const rows = enriched.map(r=>{
    const manualAwarded = (r.totalAwarded||0) - (r.autoScore||0) - (r.marks&&r.marks.paper!=null?Number(r.marks.paper):0);
    return [
      r.learner, r.autoScore, r.autoTotal, manualAwarded, r.manualTotal,
      r.marks&&r.marks.paper!=null?r.marks.paper:'', r.pct!==null?r.pct:'', r.rating||'',
      r.fullyMarked?'Fully marked':'Pending', new Date(r.submittedAt).toLocaleString()
    ];
  });
  const csv = [header, ...rows].map(row=>row.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = exam.code+'-results.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV downloaded', 'good');
}

function setErr(msg){ state.err = msg; render(); }
function togglePw(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  if(el.type==='password'){ el.type='text'; btn.textContent='Hide'; }
  else { el.type='password'; btn.textContent='Show'; }
}

/* ---------- root render ---------- */
function setupNeededView(){
  return `
  ${brandHTML()}
  <div class="card">
    <h2>One more step</h2>
    <p class="subtext">This app needs a free Firebase database connected before it can save signups, exams, and results.</p>
    <ol class="hint" style="padding-left:18px; line-height:1.9;">
      <li>Go to <span class="mono">console.firebase.google.com</span> → Add project (free)</li>
      <li>Build → Firestore Database → Create database → start in <b>test mode</b></li>
      <li>Gear icon → Project settings → "Your apps" → click <span class="mono">&lt;/&gt;</span> to register a web app</li>
      <li>Copy the config values shown, paste them into <span class="mono">firebaseConfig</span> near the top of this file's code</li>
      <li>Re-upload the file to GitHub as <span class="mono">index.html</span> — the live site updates automatically</li>
    </ol>
  </div>`;
}
function render(){
  const app = document.getElementById('app');
  if(!firebaseReady){ app.innerHTML = setupNeededView(); return; }
  document.body.classList.toggle('has-sidebar', !!state.learner);
  let html = '';
  switch(state.view){
    case 'home': html = homeView(); break;
    case 'adminLogin': html = adminLoginView(); break;
    case 'adminDashboard': html = adminDashboardView(); break;
    case 'learnerAuth': html = learnerAuthView(); break;
    case 'learnerForgot': html = learnerForgotView(); break;
    case 'learnerDashboard': html = learnerDashboardView(); break;
    case 'examTaking': html = examTakingView(); break;
    case 'examResult': html = examResultView(); break;
    case 'practiceQuiz': html = practiceQuizView(); break;
    case 'practiceResult': html = practiceResultView(); break;
    case 'examReview': html = examReviewView(); break;
    case 'examAnswerReview': html = examAnswerReviewView(); break;
    case 'teacherAuth': html = teacherAuthView(); break;
    case 'teacherDashboard': html = teacherDashboardView(); break;
    case 'teacherLeaderboard': html = teacherLeaderboardView(); break;
    case 'examBuilder': html = examBuilderView(); break;
    case 'examCreated': html = examCreatedView(); break;
    case 'examEdit': html = examEditView(); break;
    case 'noteBuilder': html = noteBuilderView(); break;
    case 'questionBank': html = questionBankView(); break;
    case 'bulkRoster': html = bulkRosterView(); break;
    case 'bulkRosterResult': html = bulkRosterResultView(); break;
    case 'classNotes': html = classNotesView(); break;
    case 'history': html = historyView(); break;
    case 'classroom': html = classroomView(); break;
    case 'messages': html = messagesView(); break;
    case 'newMessage': html = newMessageView(); break;
    case 'newGroup': html = newGroupView(); break;
    case 'chat': html = chatView(); break;
    case 'accountInfo': html = accountInfoView(); break;
    case 'notifications': html = notificationsView(); break;
    case 'learnerSettings': html = learnerSettingsView(); break;
    case 'markSubmissions': html = markSubmissionsView(); break;
    case 'examAnalytics': html = examAnalyticsView(); break;
    case 'learnerResults': html = learnerResultsView(); break;
    case 'leaderboard': html = leaderboardView(); break;
    default: html = homeView();
  }
  app.innerHTML = html;
  if(state.view==='teacherDashboard'){ renderExamList(); renderNoteList(); }
  if(state.view==='learnerDashboard'){ renderHomeworkList(); }
  if(state.view==='examBuilder') toggleQType();
  if(window.renderMathInElement){
    try{ renderMathInElement(app, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]}); }catch(e){}
  }
}

render();

/* ---------- splash screen ---------- */
const MATH_QUOTES = [
  "Every scorpion started stuck before it got sharp.",
  "Mistakes are just practice in disguise.",
  "Numbers reward patience.",
  "A wrong answer is one step closer to the right one.",
  "Sharpen your mind, one problem at a time.",
  "Practice today, precision tomorrow.",
  "Math rewards the persistent, not just the clever.",
  "Small steps, solved problems.",
  "Stay sharp — the next question is waiting.",
  "The answer is closer than it looks. Keep working."
];
let splashDismissed = false;
function dismissSplash(){
  if(splashDismissed) return;
  splashDismissed = true;
  const el = document.getElementById('splash-screen');
  if(!el) return;
  el.classList.add('fade');
  setTimeout(()=> el.remove(), 450);
}
(function initSplash(){
  const q = document.getElementById('splash-quote');
  if(q) q.textContent = MATH_QUOTES[Math.floor(Math.random()*MATH_QUOTES.length)];
  setTimeout(dismissSplash, 2200);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW registration failed', err));
  });
}

/* ---------- install banner ---------- */
let deferredInstallPrompt = null;
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function wasDismissed(){
  try{ return localStorage.getItem('ms-install-dismissed') === '1'; }catch(e){ return false; }
}
function dismissInstallBanner(){
  document.getElementById('install-banner').classList.add('hidden');
  try{ localStorage.setItem('ms-install-dismissed', '1'); }catch(e){}
}
function showInstallBanner(){
  if(isStandalone() || wasDismissed()) return;
  const banner = document.getElementById('install-banner');
  const btn = document.getElementById('install-banner-btn');
  const msg = document.getElementById('install-banner-msg');
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredInstallPrompt){
    btn.style.display = '';
    msg.textContent = 'Add it to your home screen for quick, full-screen access.';
    btn.onclick = async ()=>{
      banner.classList.add('hidden');
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
    };
  } else if(isIOS){
    btn.style.display = 'none';
    msg.textContent = 'Tap the Share icon, then "Add to Home Screen".';
  } else {
    return; // not installable and not iOS — nothing useful to show
  }
  banner.classList.remove('hidden');
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner();
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('install-banner').classList.add('hidden');
});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
  setTimeout(showInstallBanner, 1500);
}

</script>
